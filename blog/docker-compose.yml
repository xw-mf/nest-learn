services:
  postgres:
    image: postgres:17-alpine
    container_name: nest-blog-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: blog
      POSTGRES_PASSWORD: blog123 # 本地开发用，生产走环境变量
      POSTGRES_DB: blog
    ports:
      - '5433:5432'
    volumes:
      - blog-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U blog -d blog']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  blog-pgdata:
